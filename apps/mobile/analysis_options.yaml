include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - '**/*.freezed.dart'
    - '**/*.g.dart'
    - build/**
    - android/**
    - ios/**

  errors:
    # Generated model fields are snake_case to match the API wire format
    # exactly (see data/models). Renaming them would mean hand-written
    # JsonKey annotations on every field for no gain.
    non_constant_identifier_names: ignore

    # A missing await on a Future is a bug, not a style question.
    unawaited_futures: error
    avoid_empty_else: error

  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - unnecessary_await_in_return
    - use_super_parameters

    # Bangla strings are everywhere in this UI. A literal in the widget tree
    # is fine while there is one locale; this rule would fire constantly and
    # be ignored, which is worse than not having it on.
    # - prefer_const_literals_to_create_immutables
